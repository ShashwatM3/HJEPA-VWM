# Investigation 017 locked DINOv3 background.
# DINOv3 uses the registered frame microbatch of 32; every other scientific background value
# matches configs/inv017_latent_shape.yaml.

seed: 42
checkpoint_dir: /workspace/checkpoints

encoder:
  alias: dinov3_vitb16
  revision: null
  precision: bf16
  frame_microbatch: 32
  attention_implementation: sdpa
  hf_cache_dir: /workspace/hf_cache

model:
  bottleneck_mixer_dim: 512
  bottleneck_latent_blocks: 3
  decoder_dim: 512
  decoder_blocks: 4

train:
  global_batch: 64
  stage1_steps: 15000
  max_steps: 15000
  lr_bottleneck: 0.0001
  lr_coarse_flow: 0.0001
  lr_decoder: 0.0001
  lambda_var: 0.5
  lambda_cov: 0.01
  lambda_slot: 0.0
  lambda_sigreg: 0.0
  lambda_recon: 1.0
  lambda_recon_pred: 0.0
  recon_loss_mode: cosine
  recon_warmup_steps: 2000
  present_recon_only: true
  predict_residual: false
  whiten_features: false
  horizon_k: 12
  log_every: 50
  diag_every: 500

data:
  dataset: ego4d

runtime:
  mode: train
  require_wandb: true

wandb:
  entity: smahalanobis-uc-davis
  project: hjepa-vwm
